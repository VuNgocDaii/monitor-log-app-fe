<p-dialog [(visible)]="visible" header="Xác nhận thao tác" [modal]="true" [style]="{width:'460px'}" (onHide)="cancel()" [closable]="closable" [closeOnEscape]="closeOnEscape">
  <div class="confirmation-body">
    <span class="confirmation-icon"><i class="pi pi-exclamation-triangle" aria-hidden="true"></i></span>
    <div [innerHTML]="confirmText"></div>
  </div>
  <ng-template pTemplate="footer">
    <p-button [styleClass]="styleClassCancel" [label]="cancelLabel" (click)="cancel()" *ngIf="isShowCloseButton"></p-button>
    <button pButton [class]="styleClassConfirm" [label]="confirmLabel" (click)="onConfirm.emit()"></button>
  </ng-template>
</p-dialog>
