<p-toast [position]="position" [key]="key" [baseZIndex]="5000">
  <ng-template let-message pTemplate="message">
    <div class="notification-content">
      <i class="pi" [ngClass]="message.severity === 'success' ? 'pi-check-circle' : message.severity === 'error' ? 'pi-exclamation-circle' : message.severity === 'warn' ? 'pi-exclamation-triangle' : 'pi-info-circle'" aria-hidden="true"></i>
      <div><strong>{{ message.summary }}</strong><p *ngIf="message.detail">{{ message.detail }}</p></div>
    </div>
  </ng-template>
</p-toast>
