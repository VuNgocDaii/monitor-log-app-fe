<div class="workspace">
  <app-sidebar
    [currentUser]="currentUser"
    [activeItemId]="selectedItem.id"
    (itemSelected)="onMenuItemSelected($event)"
    (collapsedChange)="onSidebarCollapsed($event)"
    (manageProject)="openProjectManagement($event)"
  ></app-sidebar>

  <app-content
    [currentUser]="currentUser"
    [selectedItem]="selectedItem"
    [sidebarCollapsed]="sidebarCollapsed"
  ></app-content>

  <app-project-member-management
    *ngIf="managedProject"
    [project]="managedProject"
    (closed)="closeProjectManagement()"
    (memberCountChanged)="onProjectMemberCountChanged($event)"
  ></app-project-member-management>
</div>
