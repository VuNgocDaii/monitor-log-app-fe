<div class="workspace">
  <app-sidebar
    #sidebar
    [currentUser]="currentUser"
    [activeItemId]="selectedItem.id"
    (itemSelected)="onMenuItemSelected($event)"
    (collapsedChange)="onSidebarCollapsed($event)"
    (manageProject)="openProjectManagement($event)"
    (manageProjectConfiguration)="openProjectConfiguration($event)"
  ></app-sidebar>

  <app-content
    [currentUser]="currentUser"
    [selectedItem]="selectedItem"
    [sidebarCollapsed]="sidebarCollapsed"
    (manageProject)="openProjectManagement($event)"
    (configureProject)="openProjectConfiguration($event)"
    (createProject)="sidebar.openCreateProject()"
  ></app-content>

  <app-project-member-management
    *ngIf="managedProject"
    [project]="managedProject"
    (closed)="closeProjectManagement()"
    (memberCountChanged)="onProjectMemberCountChanged($event)"
  ></app-project-member-management>

  <app-project-configuration
    *ngIf="configuredProject"
    [project]="configuredProject"
    (closed)="closeProjectConfiguration()"
  ></app-project-configuration>
</div>
