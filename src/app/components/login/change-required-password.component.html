<main class="auth-page auth-page--password">
  <a class="auth-brand" routerLink="/login"><i class="pi pi-chart-line" aria-hidden="true"></i> Monitor Log</a>
  <section class="auth-card password-card" aria-labelledby="change-title">
    <span class="auth-icon"><i class="pi pi-lock" aria-hidden="true"></i></span>
    <h1 id="change-title">Đặt mật khẩu mới</h1>
    <p>Cập nhật mật khẩu để tiếp tục vào không gian làm việc.</p>
    <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="loading" novalidate>
      <div class="auth-field">
        <label for="username">Tên đăng nhập</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" maxlength="150"
          [attr.aria-invalid]="form.controls['username'].invalid && form.controls['username'].touched" aria-describedby="change-username-error">
        <small id="change-username-error" class="field-error" *ngIf="form.controls['username'].invalid && form.controls['username'].touched">Nhập tên đăng nhập, tối đa 150 ký tự.</small>
      </div>
      <div class="auth-field">
        <label for="currentPassword">Mật khẩu hiện tại</label>
        <input id="currentPassword" type="password" formControlName="currentPassword" autocomplete="current-password"
          [attr.aria-invalid]="form.controls['currentPassword'].invalid && form.controls['currentPassword'].touched" aria-describedby="current-password-error">
        <small id="current-password-error" class="field-error" *ngIf="form.controls['currentPassword'].invalid && form.controls['currentPassword'].touched">Nhập mật khẩu hiện tại.</small>
      </div>
      <div class="auth-field">
        <label for="newPassword">Mật khẩu mới</label>
        <input id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password"
          [attr.aria-invalid]="form.controls['newPassword'].invalid && form.controls['newPassword'].touched" aria-describedby="new-password-error">
        <small id="new-password-error" class="field-error" *ngIf="form.controls['newPassword'].invalid && form.controls['newPassword'].touched">Nhập mật khẩu mới.</small>
      </div>
      <div class="auth-field">
        <label for="confirmPassword">Xác nhận mật khẩu mới</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password"
          [attr.aria-invalid]="form.controls['confirmPassword'].touched && (form.controls['confirmPassword'].invalid || form.controls['confirmPassword'].value !== form.controls['newPassword'].value)" aria-describedby="confirm-password-error">
        <small id="confirm-password-error" class="field-error" *ngIf="form.controls['confirmPassword'].touched && (form.controls['confirmPassword'].invalid || form.controls['confirmPassword'].value !== form.controls['newPassword'].value)">Xác nhận cần trùng với mật khẩu mới.</small>
      </div>
      <button type="submit" class="auth-submit" [disabled]="loading"><i *ngIf="loading" class="pi pi-spinner pi-spin" aria-hidden="true"></i>{{ loading ? 'Đang cập nhật...' : 'Cập nhật mật khẩu' }}</button>
    </form>
    <a class="back-link" routerLink="/login"><i class="pi pi-angle-left" aria-hidden="true"></i> Quay lại đăng nhập</a>
  </section>
</main>
