<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
  <div class="w-full sm:w-30rem surface-card py-8 px-5 sm:px-8" style="border-radius: 20px">
    <h1 class="text-900 text-2xl font-medium mt-0 mb-2">Đổi mật khẩu</h1>
    <p class="text-600 mt-0 mb-5">Tài khoản yêu cầu đặt mật khẩu mới trước khi tiếp tục.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="username" class="block text-900 font-medium mb-2">Tên đăng nhập</label>
        <input id="username" type="text" formControlName="username" pInputText class="w-full" autocomplete="username">
      </div>
      <div class="field">
        <label for="currentPassword" class="block text-900 font-medium mb-2">Mật khẩu hiện tại</label>
        <p-password inputId="currentPassword" formControlName="currentPassword" [feedback]="false"
          [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" autocomplete="current-password"></p-password>
      </div>
      <div class="field">
        <label for="newPassword" class="block text-900 font-medium mb-2">Mật khẩu mới</label>
        <p-password inputId="newPassword" formControlName="newPassword" [toggleMask]="true"
          styleClass="w-full" inputStyleClass="w-full" autocomplete="new-password"></p-password>
      </div>
      <div class="field">
        <label for="confirmPassword" class="block text-900 font-medium mb-2">Xác nhận mật khẩu mới</label>
        <p-password inputId="confirmPassword" formControlName="confirmPassword" [feedback]="false"
          [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" autocomplete="new-password"></p-password>
      </div>
      <button type="submit" pButton pRipple class="w-full p-3 text-xl" [disabled]="loading"
        [label]="loading ? 'Đang cập nhật...' : 'Đổi mật khẩu'"></button>
    </form>
  </div>
</div>
